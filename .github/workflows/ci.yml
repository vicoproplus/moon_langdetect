name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-platform gate: the module must compile and pass `moon check` on every
  # supported host. The bit-level assertions are NOT run here — see `test`.
  build:
    name: check and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100
        with:
          version: latest

      - name: Toolchain versions
        run: moon version --all

      - name: moon check
        run: moon check

      - name: Build native
        run: moon build --target native

      - name: Build js
        run: moon build --target js

      - name: Build wasm-gc
        run: moon build --target wasm-gc

  # The golden fixtures under src/**/*_test.mbt embed libm `log` bit patterns
  # recorded on win32 x64. `ln_for_gauss` binds the host libm on native, so the
  # bit-level assertions only hold on Windows x64; other hosts are covered by
  # the `build` job above.
  test:
    name: test native (windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit
        uses: moonbit-community/setup-moonbit@04293a8a813bfd4b6c2fce22701b52ae1050d100
        with:
          version: latest

      - name: Test native
        run: moon test --target native
